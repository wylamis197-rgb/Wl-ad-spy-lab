name: Inspect extension bundle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-app-bundle.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect compressed app bundle
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          const s = gunzipSync(readFileSync('src/app.js.gz')).toString('utf8');
          for (const term of ['zenly','zedly','/api/analyze','Authorization','Bearer','backendUrl','apiToken','accessToken']) {
            const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig');
            let m, count = 0;
            while ((m = re.exec(s)) && count < 12) {
              console.log('TERM', term, 'OFFSET', m.index);
              console.log(s.slice(Math.max(0,m.index-500), Math.min(s.length,m.index+700)).replace(/\\n/g,' '));
              count++;
            }
            if (!count) console.log('TERM', term, 'NOT FOUND');
          }
          console.log('BUNDLE LENGTH', s.length);
          NODE
